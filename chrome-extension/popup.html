<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Matrix Data Collector v2</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 390px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0a0a0a; color: #fff; }
    .header { padding: 18px 18px 12px; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-icon { width: 32px; height: 32px; border-radius: 9px; background: linear-gradient(135deg, #6366f1, #8b5cf6); display: flex; align-items: center; justify-content: center; }
    .title { font-size: 15px; font-weight: 600; }
    .subtitle { font-size: 11px; color: rgba(255,255,255,0.45); margin-top: 2px; }
    .pill { display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:999px;background:rgba(99,102,241,0.18);color:#c7d2fe;font-size:10.5px;font-weight:600;letter-spacing:.02em; }
    .content { padding: 14px 18px 18px; }
    .status { display:flex;align-items:center;justify-content:space-between;padding:9px 12px;background:rgba(255,255,255,0.04);border-radius:9px;font-size:12.5px;color:rgba(255,255,255,0.72);margin-bottom:12px; }
    .status .dot { width:7px;height:7px;border-radius:50%;margin-right:6px; }
    .status .dot.ok { background:#22c55e; box-shadow:0 0 8px #22c55e; }
    .status .dot.err { background:#ef4444; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .stat { background: rgba(255,255,255,0.04); border-radius: 10px; padding: 10px 11px; }
    .stat-label { font-size: 10.5px; color: rgba(255,255,255,0.5); margin-bottom: 3px; }
    .stat-value { font-size: 17px; font-weight: 600; }
    .btn-group { display: flex; flex-direction: column; gap: 7px; margin-bottom: 14px; }
    button { width: 100%; padding: 10.5px 12px; border: none; border-radius: 9px; font-size: 12.5px; font-weight: 500; cursor: pointer; transition: all .18s; }
    .btn-primary { background: #6366f1; color: #fff; }
    .btn-primary:hover { background: #4f46e5; }
    .btn-secondary { background: rgba(255,255,255,0.06); color: #fff; border: 1px solid rgba(255,255,255,0.08); }
    .btn-secondary:hover { background: rgba(255,255,255,0.1); }
    .section { border-top: 1px solid rgba(255,255,255,0.06); padding-top: 12px; margin-top: 4px; }
    .section-title { font-size: 11px; color: rgba(255,255,255,0.45); margin-bottom: 9px; letter-spacing: .03em; text-transform: uppercase; font-weight: 600; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .field { margin-bottom: 9px; }
    .field label { display:block;font-size:11px;color:rgba(255,255,255,0.45);margin-bottom:4px; }
    .field input { width:100%;padding:8px 10px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:7px;color:#fff;font-size:12px;outline:none; }
    .field input:focus { border-color:#6366f1; }
    .tog-row { display:flex;align-items:center;justify-content:space-between;padding:6px 0; }
    .tog-label { font-size: 12px; }
    .toggle { position:relative;width:34px;height:19px;background:rgba(255,255,255,0.1);border-radius:999px;cursor:pointer;transition:.2s; }
    .toggle.on { background: #6366f1; }
    .toggle::after { content:'';position:absolute;top:2px;left:2px;width:15px;height:15px;background:#fff;border-radius:50%;transition:.2s; }
    .toggle.on::after { left: 17px; }
    .op-card { background: linear-gradient(135deg, rgba(99,102,241,0.18), rgba(139,92,246,0.06)); border: 1px solid rgba(99,102,241,0.25); border-radius: 10px; padding: 10px 11px; margin-bottom: 10px; font-size: 12px; }
    .op-row { display:flex;align-items:center;justify-content:space-between;margin:4px 0; }
    .op-row .k { color: rgba(255,255,255,0.5); }
    .op-row .v { color: #fff; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; max-width: 220px; overflow:hidden; text-overflow:ellipsis; white-space: nowrap; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <div class="logo-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>
      </div>
      <div>
        <div class="title" style="display:flex;align-items:center;gap:6px;">Matrix Collector<span class="pill">v2 · RBAC</span></div>
        <div class="subtitle">Multi-Account · Community · SSO</div>
      </div>
    </div>
  </div>

  <div class="content">
    <div class="status"><span style="display:flex;align-items:center;"><span id="sd" class="dot ok"></span><span id="st">就绪</span></span><span id="et" style="color:#a1a1aa;font-family:ui-monospace, Menlo, monospace;font-size:11px;"></span></div>

    <div class="stats">
      <div class="stat"><div class="stat-label">本地记录</div><div class="stat-value" id="lc">0</div></div>
      <div class="stat"><div class="stat-label">待上传</div><div class="stat-value" id="pc">0</div></div>
    </div>

    <div class="btn-group">
      <button class="btn-primary" id="cbtn">立即采集当前页面</button>
      <button class="btn-secondary" id="rbtn">重试待上传记录</button>
    </div>

    <div class="section">
      <div class="section-title">当前运营身份（溯源）</div>
      <div class="op-card" id="opCard">
        <div class="op-row"><span class="k">Operator UID</span><span class="v" id="opUid">—</span></div>
        <div class="op-row"><span class="k">姓名</span><span class="v" id="opName">—</span></div>
        <div class="op-row"><span class="k">机器名称</span><span class="v" id="opMachine">—</span></div>
        <div class="op-row"><span class="k">Machine ID</span><span class="v" id="opMid">—</span></div>
      </div>

      <div class="row">
        <div class="field"><label>Operator UID</label><input id="uid" placeholder="内部 user_id / JWT sub" /></div>
        <div class="field"><label>运营姓名</label><input id="uname" placeholder="如：运营-李雷" /></div>
      </div>
      <div class="row">
        <div class="field"><label>机器名称</label><input id="mname" placeholder="如：运营A-MBP16" /></div>
        <div class="field" style="display:flex;flex-direction:column;justify-content:flex-end;">
          <label>SSO JWT Token</label>
          <input id="jwt" placeholder="粘贴内部系统 JWT 自动解析" />
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">服务器</div>
      <div class="field"><label>API Endpoint</label><input id="ep" placeholder="http://localhost:8000/api/collect" /></div>
      <div class="field"><label>API Token (可选)</label><input id="tok" type="password" placeholder="Bearer Token" /></div>
      <div class="tog-row"><span class="tog-label">自动上传</span><div class="toggle on" id="tu"></div></div>
      <div class="tog-row"><span class="tog-label">本地存储</span><div class="toggle on" id="ts"></div></div>
      <button class="btn-secondary" id="save" style="margin-top:10px;">保存全部配置</button>
    </div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    let cfg = null;
    const setStatus = (t, ok=true) => { $('st').textContent = t; $('sd').className = 'dot ' + (ok ? 'ok' : 'err'); };
    const load = () => {
      chrome.runtime.sendMessage({ type: 'GET_CONFIG' }, r => {
        cfg = r.config;
        $('ep').value    = cfg.apiEndpoint    || '';
        $('tok').value   = cfg.apiToken       || '';
        $('jwt').value   = cfg.jwtToken       || '';
        $('uid').value   = cfg.operator_uid   || '';
        $('uname').value = cfg.operator_name  || '';
        $('mname').value = cfg.machine_name   || '';
        $('opUid').textContent   = cfg.operator_uid   || '未设置 (使用空值)';
        $('opName').textContent  = cfg.operator_name  || '未填写';
        $('opMachine').textContent = cfg.machine_name || '未填写';
        $('opMid').textContent    = cfg.machine_id    || '—';
        $('tu').classList.toggle('on', !!cfg.enableAutoUpload);
        $('ts').classList.toggle('on', !!cfg.enableLocalStorage);
        $('et').textContent = 'v' + (cfg.client_version || '2.0.0');
      });
      chrome.runtime.sendMessage({ type: 'GET_RECORDS' }, r => { $('lc').textContent = r?.total || 0; });
      chrome.storage.local.get(['matrix_pending_uploads'], r => { $('pc').textContent = (r.matrix_pending_uploads || []).length; });
    };

    $('cbtn').onclick = () => {
      setStatus('采集中…');
      chrome.runtime.sendMessage({ type: 'TRIGGER_COLLECT' }, r => {
        const d = r?.result?.data;
        if (r?.result?.success && d) {
          setStatus(`✓ ${d.platform} · ${d.account}`, true);
          chrome.storage.local.get(['matrix_pending_uploads'], rr => $('pc').textContent = (rr.matrix_pending_uploads || []).length);
        } else setStatus('失败或页面不支持', false);
      });
    };
    $('rbtn').onclick = () => { setStatus('重试上传…'); chrome.runtime.sendMessage({ type: 'RETRY_PENDING' }, r => { setStatus(`剩余 ${r.remaining || 0}`); load(); }); };
    $('tu').onclick = function() { this.classList.toggle('on'); };
    $('ts').onclick = function() { this.classList.toggle('on'); };
    $('save').onclick = () => {
      const payload = {
        apiEndpoint: $('ep').value.trim(),
        apiToken:    $('tok').value.trim(),
        jwtToken:    $('jwt').value.trim(),
        operator_uid:   $('uid').value.trim(),
        operator_name:  $('uname').value.trim(),
        machine_name:   $('mname').value.trim(),
        enableAutoUpload: $('tu').classList.contains('on'),
        enableLocalStorage:$('ts').classList.contains('on'),
      };
      chrome.runtime.sendMessage({ type: 'UPDATE_CONFIG', payload }, r => {
        setStatus(r.success ? '已保存配置' : '保存失败', r.success);
        load();
      });
    };

    load();
  </script>
</body>
</html>
