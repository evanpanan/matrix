<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>Matrix Collector</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { width: 380px; min-height: 520px; background: #FAFBFF; }
  .pill { display:inline-flex; align-items:center; gap:6px; padding:2px 10px; border-radius:999px; font-size:11px; font-weight:600; }
  .dot { width:8px; height:8px; border-radius:999px; }
  input, select { outline: none; }
  .gr { background-image: linear-gradient(135deg,#6366f1 0%,#8b5cf6 50%,#0ea5e9 100%); }
</style>
</head>
<body class="text-ink-900 text-sm antialiased">
  <div class="px-4 pt-4 pb-5">
    <div class="flex items-center justify-between mb-3">
      <div class="flex items-center gap-2.5">
        <div class="gr text-white w-9 h-9 rounded-xl flex items-center justify-center shadow-sm">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="7" r="2.2"/><circle cx="18" cy="7" r="2.2"/><circle cx="12" cy="16" r="2.2"/><path d="M6 7 L12 16 L18 7"/></svg>
        </div>
        <div>
          <div class="font-bold text-[15px] leading-tight">Matrix Collector</div>
          <div class="text-[11px] text-ink-400 font-medium">Chrome Extension · v2.0</div>
        </div>
      </div>
      <div id="statePill" class="pill bg-amber-50 text-amber-700"><span class="dot bg-amber-500"></span><span id="stateText">启动中…</span></div>
    </div>

    <div class="bg-white rounded-2xl border border-black/[0.05] shadow-sm p-3.5 space-y-3">
      <div>
        <label class="block text-[11px] text-ink-500 font-semibold mb-1.5 tracking-wide">归属运营</label>
        <select id="opSelect" class="w-full h-10 rounded-xl border border-black/[0.07] bg-white px-3 text-sm font-medium"></select>
      </div>
      <div class="grid grid-cols-2 gap-2.5">
        <div>
          <label class="block text-[11px] text-ink-500 font-semibold mb-1.5 tracking-wide">机器名称</label>
          <input id="machineName" class="w-full h-10 rounded-xl border border-black/[0.07] bg-white px-3 text-sm tabular-nums" />
        </div>
        <div>
          <label class="block text-[11px] text-ink-500 font-semibold mb-1.5 tracking-wide">机器 ID</label>
          <input id="machineId" readonly class="w-full h-10 rounded-xl border border-black/[0.05] bg-slate-50 px-3 text-[11px] text-ink-500 tabular-nums" />
        </div>
      </div>
      <div>
        <label class="block text-[11px] text-ink-500 font-semibold mb-1.5 tracking-wide">后端服务地址</label>
        <div class="flex gap-2">
          <input id="serverUrl" class="flex-1 h-10 rounded-xl border border-black/[0.07] bg-white px-3 text-sm tabular-nums" placeholder="http://localhost:8000" />
          <button id="saveBtn" class="h-10 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold shadow-sm">保存</button>
        </div>
      </div>
      <div>
        <label class="block text-[11px] text-ink-500 font-semibold mb-1.5 tracking-wide">Webhook（可选 · 爆款事件推送）</label>
        <input id="webhook" class="w-full h-10 rounded-xl border border-black/[0.07] bg-white px-3 text-sm tabular-nums" placeholder="https://open.feishu.cn/..." />
      </div>
    </div>

    <div class="mt-3 bg-white rounded-2xl border border-black/[0.05] shadow-sm p-3.5">
      <div class="flex items-center justify-between mb-2.5">
        <div class="font-semibold text-[13.5px]">实时状态</div>
        <div class="pill bg-slate-50 text-slate-600"><span id="queueBadge">0</span> 条待同步</div>
      </div>
      <div class="grid grid-cols-2 gap-2 text-[12px]">
        <div class="rounded-xl bg-slate-50/80 p-2.5">
          <div class="text-ink-400 text-[11px] font-medium mb-0.5">最后心跳</div>
          <div id="lastHb" class="text-ink-800 font-semibold tabular-nums">—</div>
        </div>
        <div class="rounded-xl bg-slate-50/80 p-2.5">
          <div class="text-ink-400 text-[11px] font-medium mb-0.5">最近同步</div>
          <div id="lastFlush" class="text-ink-800 font-semibold tabular-nums">—</div>
        </div>
        <div class="rounded-xl bg-slate-50/80 p-2.5 col-span-1">
          <div class="text-ink-400 text-[11px] font-medium mb-0.5">最近采集</div>
          <div id="lastCollect" class="text-ink-800 font-semibold tabular-nums">—</div>
        </div>
        <div class="rounded-xl bg-slate-50/80 p-2.5 col-span-1">
          <div class="text-ink-400 text-[11px] font-medium mb-0.5">后端连接</div>
          <div id="connStatus" class="text-ink-800 font-semibold tabular-nums">—</div>
        </div>
      </div>
      <div id="errorBox" class="hidden mt-3 rounded-xl bg-red-50 border border-red-100 text-red-700 text-[11.5px] p-2.5 break-words"></div>
    </div>

    <div class="mt-3 grid grid-cols-2 gap-2.5">
      <button id="triggerBtn" class="h-11 rounded-xl bg-white border border-black/[0.07] hover:bg-sky-50 text-sky-700 text-[13px] font-semibold shadow-sm">
        <span class="inline-flex items-center justify-center gap-1.5">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 V4 M12 20 V22 M4.93 4.93 L6.34 6.34 M17.66 17.66 L19.07 19.07 M2 12 H4 M20 12 H22 M4.93 19.07 L6.34 17.66 M17.66 6.34 L19.07 4.93"/><circle cx="12" cy="12" r="4"/></svg>
          采集当前页
        </span>
      </button>
      <button id="flushBtn" class="h-11 rounded-xl bg-gradient-to-br from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 text-white text-[13px] font-semibold shadow-md">
        <span class="inline-flex items-center justify-center gap-1.5">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12 a9 9 0 0 1 15.5 -6.36 L21 8"/><path d="M21 3 V8 H16"/><path d="M21 12 a9 9 0 0 1 -15.5 6.36 L3 16"/><path d="M3 21 V16 H8"/></svg>
          立即同步全部
        </span>
      </button>
    </div>

    <div class="mt-4 text-[11px] text-ink-400 text-center leading-relaxed">
      心跳每 3 分钟 · 数据每 60 秒同步<br/>
      浏览器右上角点击插件即可查看
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
